<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- phone body -->
  <rect x="34" y="14" width="52" height="94" rx="12" fill="#4F7CFF"/>
  <rect x="34" y="14" width="52" height="94" rx="12" fill="url(#phoneShade)" opacity="0.25"/>
  <circle cx="60" cy="20.5" r="1.6" fill="#DCE5FF"/>
  <!-- screen -->
  <rect x="40" y="26" width="40" height="66" rx="5" fill="#FFFFFF"/>
  <!-- home indicator -->
  <rect x="51" y="98" width="18" height="3.2" rx="1.6" fill="#DCE5FF"/>
  <!-- envelope on screen -->
  <rect x="46" y="38" width="28" height="19" rx="2.5" fill="none" stroke="#0B7A5C" stroke-width="2.4"/>
  <path d="M47 39.5 L60 50 L73 39.5" fill="none" stroke="#0B7A5C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- institutional text lines -->
  <rect x="46" y="63" width="22" height="3" rx="1.5" fill="#E3E7E3"/>
  <rect x="46" y="70" width="16" height="3" rx="1.5" fill="#E3E7E3"/>
  <!-- verified check badge -->
  <circle cx="76" cy="70" r="15" fill="#2ED9A8"/>
  <path d="M69 70 L74.5 75.5 L84 63.5" fill="none" stroke="#FFFFFF" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  <defs>
    <linearGradient id="phoneShade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
  </defs>
</svg>
